name: Recover the stalled Mesh Space

on:
  push:
    branches: [codex/space-startup-diagnostics]

permissions: {}

jobs:
  restart:
    if: github.event.head_commit.message == 'Restart the stalled Space once'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Restart the stalled free-tier Space and verify the uploaded revision
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          hub = "https://huggingface.co/api/spaces/wuhp/webgputest"
          app = "https://wuhp-webgputest.hf.space"
          target = "c4c0b03e47f7403a0023e100e81cbc90ce9d915e"
          old = "e72a56b66a074f6478274988e65af88f93e86ef5"
          token = os.environ["HF_TOKEN"]
          if not token:
              raise SystemExit("HF_TOKEN is unavailable")
          def hub_json(path="", method="GET"):
              req = urllib.request.Request(hub + path, method=method, headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.load(response)
          source = hub_json()
          runtime = hub_json("/runtime")
          if source.get("sha") != target:
              raise SystemExit("The Space repository moved during diagnosis")
          if runtime.get("sha") != target or runtime.get("stage") != "RUNNING":
              hardware = runtime.get("hardware", {})
              if (runtime.get("sha"), runtime.get("stage")) != (old, "RUNNING_APP_STARTING") or hardware.get("requested") != "cpu-basic":
                  raise SystemExit("The Space state changed during diagnosis. Inspect its latest runtime before restarting.")
              started = hub_json("/restart", method="POST")
              print("Normal restart accepted", started.get("stage"), flush=True)
          deadline = time.monotonic() + 420
          last = None
          while time.monotonic() < deadline:
              try:
                  runtime = hub_json("/runtime")
                  seen = (runtime.get("stage"), runtime.get("sha"))
                  if seen != last:
                      print("Runtime", *seen, flush=True)
                      last = seen
                  if seen == ("RUNNING", target):
                      health = urllib.request.Request(app + "/health", headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(health, timeout=10) as response:
                          if response.headers.get("x-mesh-state-format") == "mesh-state-aes256gcm-v1":
                              print("Uploaded revision is healthy with encrypted state")
                              break
              except (TimeoutError, urllib.error.URLError):
                  pass
              time.sleep(8)
          else:
              raise SystemExit("Space did not switch to the uploaded revision after the normal restart")
          PY
