name: Diagnose Mesh Space startup

on:
  push:
    branches: [codex/space-startup-diagnostics]

permissions: {}

jobs:
  diagnostics:
    name: Read Space startup diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Classify startup logs without publishing raw lines
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          base = "https://huggingface.co/api/spaces/wuhp/webgputest"
          token = os.environ["HF_TOKEN"]
          if not token:
              raise SystemExit("HF_TOKEN is unavailable")
          def request(path):
              return urllib.request.urlopen(urllib.request.Request(
                  base + path, headers={"Authorization": "Bearer " + token}
              ), timeout=8)

          for label, path in [("runtime", "/runtime"), ("source", "")]:
              with request(path) as response:
                  value = json.load(response)
              runtime = value.get("runtime", value)
              print(label, json.dumps({k: runtime.get(k) for k in ("stage", "sha", "hardware", "replicas")}))
          markers = {
              "startup_panic": r"panicked at",
              "missing_github_configuration": r"requires? github|github storage is required|gh_token.*required",
              "github_state_load": r"github cluster storage is configured but could not be loaded",
              "state_encryption_configuration": r"state encryption configuration invalid",
              "state_authentication": r"could not authenticate|authentication failed|invalid authentication tag",
              "state_decode": r"invalid type:|missing field|duplicate field|expected value|could not decode|could not parse|invalid.*snapshot",
              "state_migration": r"could not encrypt legacy state",
              "recovery_configuration": r"invalid operator recovery configuration",
              "github_http_401": r"github[^\n]*\b401\b",
              "github_http_403": r"github[^\n]*\b403\b",
              "github_http_404": r"github[^\n]*\b404\b",
              "github_http_429": r"github[^\n]*\b429\b",
              "github_http_5xx": r"github[^\n]*\b5[0-9]{2}\b",
              "tls": r"certificate verify|unknownissuer|invalid peer certificate|tls.*error",
              "network_timeout": r"timed out|timeout",
              "bind_error": r"bind coordinator|address already in use",
              "server_ready": r"mesh coordinator listening",
              "out_of_memory": r"out of memory|oomkilled|sigkill|exit code:? 137|signal:? 9",
              "loader_error": r"error while loading shared libraries|glibc_.*not found|exec format error|illegal instruction",
              "build_started": r"starting build|building image|compiling mesh-coordinator",
              "build_completed": r"finished .*release|pushing image|exporting to image|build complete",
              "build_failure": r"failed to solve|error: could not compile|error: failed to download|failed to build|no space left",
          }
          for kind in ("build", "run"):
              counts = collections.Counter()
              lines = 0
              end = time.monotonic() + 12
              try:
                  with request(f"/logs/{kind}?tail=120") as response:
                      while lines < 250 and time.monotonic() < end:
                          raw = response.readline(16384)
                          if not raw:
                              break
                          line = raw.decode(errors="replace").strip()
                          if not line.startswith("data:"):
                              continue
                          lines += 1
                          for key, pattern in markers.items():
                              if re.search(pattern, line, re.IGNORECASE):
                                  counts[key] += 1
              except urllib.error.HTTPError as error:
                  print(kind, "HTTP", error.code)
              except (TimeoutError, OSError):
                  print(kind, "log stream idle")
              print(kind, json.dumps({"log_lines": lines, "markers": counts}, sort_keys=True))
          PY
