name: Test and deploy Space

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# This project uses the browser ONNX runtime; skip native CUDA downloads.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build

  backend:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"
      - name: Test deployment encryption and migration lifecycle
        run: python3 -m unittest discover -s tests -p test_deployment.py
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml --locked
      - name: Validate operator public recovery configuration
        run: cargo run --manifest-path server/Cargo.toml --locked --bin mesh-key-recovery -- validate-config ops/key-recovery-recipients.json
      - name: Run discrete-event recovery simulation
        shell: bash
        run: |
          cargo run --manifest-path server/Cargo.toml --locked --bin recovery-bench | tee recovery-benchmark.csv
          cargo run --manifest-path server/Cargo.toml --locked --bin checkpoint-bench | tee checkpoint-policy-benchmark.csv
          cargo run --manifest-path server/Cargo.toml --locked --bin checkpoint-montecarlo | tee checkpoint-montecarlo.csv
          {
            echo '### Recovery policy simulation (modeled milliseconds and MB; not hardware measurements)'
            echo
            echo '```csv'
            cat recovery-benchmark.csv
            echo '```'
            echo
            echo '### Adaptive checkpoint policy comparison (modeled values; not hardware measurements)'
            echo
            echo '```csv'
            cat checkpoint-policy-benchmark.csv
            echo '```'
            echo
            echo '### Seeded Monte Carlo checkpoint evaluation (assumed reliability and links; not hardware measurements)'
            echo
            echo '```csv'
            cat checkpoint-montecarlo.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser-integration:
    name: Browser WebRTC and shard recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Test production browser runtime and inference assets
        run: npx playwright test tests/e2e/application-runtime.spec.ts
        env:
          MESH_TEST_PRODUCTION: '1'

  container:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mesh-cluster:ci

  deploy:
    name: Deploy Hugging Face Docker Space
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, container, browser-integration]
    concurrency:
      group: huggingface-space-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload tested source to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.repo }}
        run: |
          python -m pip install --disable-pip-version-check 'huggingface_hub>=0.32,<2'
          python - <<'PY'
          import os
          import json
          import re
          from pathlib import Path
          import secrets
          import time
          from urllib.request import urlopen
          from urllib.parse import urlsplit
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          raw_repo = os.environ["HF_SPACE_REPO"].strip().rstrip("/")
          path = urlsplit(raw_repo).path.strip("/") if "://" in raw_repo else raw_repo
          parts = path.split("/")
          if parts and parts[0] == "spaces":
              parts = parts[1:]
          if len(parts) != 2 or not all(parts):
              raise SystemExit("The repo secret must be a Space URL or owner/name, such as https://huggingface.co/spaces/owner/name")

          repo_id = "/".join(parts)
          api = HfApi(token=token)
          # Keep the authenticator encryption key out of GitHub state snapshots.
          # Never replace an existing key: that would invalidate enrolled secrets.
          # Public recipients are pinned per exact Space ID, so forks targeting a
          # different Space never inherit another operator's recovery recipient.
          recipients = json.loads(Path("ops/key-recovery-recipients.json").read_text(encoding="utf-8"))
          recovery_recipient = recipients.get(repo_id)
          if recovery_recipient:
              if not re.fullmatch(r"age1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{58}", recovery_recipient):
                  raise SystemExit("Invalid public age recipient in operator configuration")
              variables = api.get_space_variables(repo_id=repo_id)
              current = variables.get("MESH_KEY_RECOVERY_RECIPIENT")
              if current is not None and current.value != recovery_recipient:
                  raise SystemExit("Recovery recipient differs from the configured Space; rotate it explicitly after preserving the old identity")
              if current is None:
                  api.add_space_variable(repo_id=repo_id, key="MESH_KEY_RECOVERY_RECIPIENT", value=recovery_recipient)
                  print("Pinned the operator public recovery recipient")
          configured_secrets = api.get_space_secrets(repo_id=repo_id)
          if "MESH_AUTH_ENCRYPTION_KEY" not in configured_secrets:
              api.add_space_secret(repo_id=repo_id, key="MESH_AUTH_ENCRYPTION_KEY", value=secrets.token_hex(32))
              print("Provisioned the Space authenticator encryption secret")
          if "MESH_STATE_ENCRYPTION_KEY" not in configured_secrets:
              # Only first-time provisioning opens a short, bounded legacy import.
              # The running server closes it immediately after its encrypted write.
              api.add_space_secret(repo_id=repo_id, key="MESH_STATE_PLAINTEXT_MIGRATION_UNTIL", value=str(int(time.time()) + 900))
              api.add_space_secret(repo_id=repo_id, key="MESH_STATE_ENCRYPTION_KEY", value=secrets.token_hex(32))
              print("Provisioned separate state encryption secret and bounded migration")
          uploaded = api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              commit_message=f"Deploy GitHub {os.environ['GITHUB_SHA'][:7]}",
              ignore_patterns=[".git/**", ".github/**", "node_modules/**", "server/target/**", "target/**", "work/**", "outputs/**", "mesh-recovery-identity.txt", "**/mesh-recovery-identity.txt", "recovered-space-keys*.json", "**/recovered-space-keys*.json", "*.age", "**/*.age"],
          )
          # Wait for this code generation, not the old container's plain /health.
          # No bearer credentials are sent to this public health endpoint.
          space_host = api.get_space_runtime(repo_id=repo_id).raw["domains"][0]["domain"]
          health_url = f"https://{space_host}/health"
          def wait_for_encrypted_state():
              until = time.monotonic() + 600
              while time.monotonic() < until:
                  try:
                      with urlopen(health_url, timeout=10) as response:
                          ready = response.headers.get("x-mesh-state-format") == "mesh-state-aes256gcm-v1"
                      runtime = api.get_space_runtime(repo_id=repo_id)
                      if ready and runtime.stage == "RUNNING" and runtime.raw.get("sha") == uploaded.oid:
                          return
                  except Exception:
                      pass
                  time.sleep(5)
              raise SystemExit("Space did not become healthy with encrypted state; inspect container logs")
          wait_for_encrypted_state()
          if "MESH_STATE_PLAINTEXT_MIGRATION_UNTIL" in api.get_space_secrets(repo_id=repo_id):
              api.delete_space_secret(repo_id=repo_id, key="MESH_STATE_PLAINTEXT_MIGRATION_UNTIL")
              print("Removed legacy import permission after encrypted-state readiness")
              # Configuration changes restart the Space. A brief delay avoids reading
              # the retiring container before checking the replacement.
              time.sleep(10)
              wait_for_encrypted_state()
          if recovery_recipient:
              with urlopen(f"https://{space_host}/api/operator/key-backup", timeout=15) as response:
                  if response.headers.get("x-mesh-recovery-recipient") != recovery_recipient:
                      raise SystemExit("Space recovery export does not match the pinned public recipient")
                  encrypted_backup = response.read(16 * 1024 + 1)
                  if len(encrypted_backup) > 16 * 1024 or not encrypted_backup.startswith(b"age-encryption.org/v1\n"):
                      raise SystemExit("Space did not return a bounded age-encrypted key backup")
              print("Verified encrypted operator key export for the pinned recipient")
          print("Space healthy with authenticated encrypted state")
          print(f"Deployed tested source to https://huggingface.co/spaces/{repo_id}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Hugging Face Space deployment\n\nUploaded tested commit `{os.environ['GITHUB_SHA']}` to [https://huggingface.co/spaces/{repo_id}](https://huggingface.co/spaces/{repo_id}). The Space now builds the Dockerfile.\n")
          PY
